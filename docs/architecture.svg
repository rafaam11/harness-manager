<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Pretendard, Segoe UI, Malgun Gothic, sans-serif" role="img" aria-label="harness-manager 구조">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b746f"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8825f"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="14" fill="#181716" stroke="#3b3633"/>

  <!-- 위: renderer → preload → main -->
  <rect x="32" y="40" width="250" height="132" rx="10" fill="#221f1e" stroke="#3b3633"/>
  <text x="48" y="66" font-size="15" font-weight="700" fill="#ece8e5">Renderer · React 18</text>
  <text x="48" y="92" font-size="11.5" fill="#a59e98">상태판 · 설치 · 카탈로그 · 정리</text>
  <text x="48" y="110" font-size="11.5" fill="#a59e98">가져오기 · 외부 API · 셋업 위저드</text>
  <text x="48" y="140" font-size="11.5" fill="#a59e98"><tspan fill="#e8825f">call("채널", id…)</tspan> — 경로·명령은 안 보낸다</text>
  <text x="48" y="158" font-size="11" fill="#7b746f">sandbox · contextIsolation · CSP</text>

  <rect x="355" y="40" width="250" height="132" rx="10" fill="#221f1e" stroke="#3b3633"/>
  <text x="371" y="66" font-size="15" font-weight="700" fill="#ece8e5">preload · 타입드 IPC</text>
  <text x="371" y="92" font-size="11.5" fill="#a59e98">ApiChannels 맵 하나에서</text>
  <text x="371" y="110" font-size="11.5" fill="#a59e98">노출과 핸들러 등록을 함께 만든다</text>
  <text x="371" y="140" font-size="11.5" fill="#a59e98">보낸 창 검증 · 정확한 키 검증(400)</text>
  <text x="371" y="158" font-size="11" fill="#7b746f">ApiResult 봉투 → 403/404/409/422</text>

  <rect x="678" y="40" width="250" height="132" rx="10" fill="#221f1e" stroke="#3b3633"/>
  <text x="694" y="66" font-size="15" font-weight="700" fill="#ece8e5">main · Electron 43</text>
  <text x="694" y="92" font-size="11.5" fill="#a59e98">manifest에서 명령·인자를 만든다</text>
  <text x="694" y="110" font-size="11.5" fill="#a59e98">withLock · 단일 인스턴스</text>
  <text x="694" y="140" font-size="11.5" fill="#a59e98">updater · QuitCoordinator · 작업표시줄</text>
  <text x="694" y="158" font-size="11" fill="#7b746f">hm-cli 심(~/.harness-manager/bin)</text>

  <line x1="284" y1="106" x2="351" y2="106" stroke="#7b746f" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="607" y1="106" x2="674" y2="106" stroke="#7b746f" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 가운데: 엔진 -->
  <rect x="32" y="206" width="896" height="104" rx="10" fill="#2c231e" stroke="#e8825f"/>
  <text x="48" y="232" font-size="15" font-weight="700" fill="#ece8e5">엔진 — 순수 Node(Electron 없음). 앱 · <tspan font-family="Cascadia Mono, Consolas, monospace">hm</tspan> CLI · vitest가 같은 코드</text>
  <g font-size="12">
    <rect x="48" y="246" width="200" height="50" rx="7" fill="#221f1e" stroke="#4f4945"/>
    <text x="62" y="267" font-weight="700" fill="#73b987">doctor</text><text x="62" y="286" font-size="11" fill="#a59e98">카드 8장 · 상태 5종</text>
    <rect x="262" y="246" width="200" height="50" rx="7" fill="#221f1e" stroke="#4f4945"/>
    <text x="276" y="267" font-weight="700" fill="#e8825f">install</text><text x="276" y="286" font-size="11" fill="#a59e98">plan → dry-run → run → verify</text>
    <rect x="476" y="246" width="200" height="50" rx="7" fill="#221f1e" stroke="#4f4945"/>
    <text x="490" y="267" font-weight="700" fill="#6ea8d8">capture</text><text x="490" y="286" font-size="11" fill="#a59e98">이 PC → 레포 · 노출 경고</text>
    <rect x="690" y="246" width="222" height="50" rx="7" fill="#221f1e" stroke="#4f4945"/>
    <text x="704" y="267" font-weight="700" fill="#d8a24a">cleanup · repo-sync</text><text x="704" y="286" font-size="11" fill="#a59e98">아카이브만 · ff-only만</text>
  </g>
  <line x1="803" y1="174" x2="803" y2="202" stroke="#7b746f" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 아래: 레포와 사용자 홈 -->
  <rect x="32" y="344" width="330" height="100" rx="10" fill="#221f1e" stroke="#3b3633"/>
  <text x="48" y="370" font-size="15" font-weight="700" fill="#ece8e5">이 레포 (정본)</text>
  <text x="48" y="394" font-size="11.5" fill="#a59e98" font-family="Cascadia Mono, Consolas, monospace">manifest/ · home/ · mods/ · plugins/</text>
  <text x="48" y="414" font-size="11.5" fill="#a59e98">.claude-plugin/marketplace.json (jinmin)</text>
  <text x="48" y="432" font-size="11" fill="#7b746f">개인 값은 ~/.harness-manager/profile/</text>

  <rect x="430" y="344" width="498" height="100" rx="10" fill="#221f1e" stroke="#3b3633"/>
  <text x="446" y="370" font-size="15" font-weight="700" fill="#ece8e5">사용자 홈 — 관리 키 · 마커 블록만</text>
  <text x="446" y="394" font-size="11.5" fill="#a59e98" font-family="Cascadia Mono, Consolas, monospace">~/.claude · ~/.claude.json(읽기 전용) · ~/.codex · PS 프로필 · git</text>
  <text x="446" y="414" font-size="11.5" fill="#a59e98">writeFileChecked: 원본 대조 → 백업 → temp → rename(409)</text>
  <text x="446" y="432" font-size="11" fill="#7b746f">경로 allowlist(403) · 정리는 ~/.claude/archive로 이동</text>

  <line x1="200" y1="340" x2="200" y2="314" stroke="#7b746f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="208" y="332" font-size="10.5" fill="#7b746f">읽기</text>
  <line x1="360" y1="312" x2="360" y2="340" stroke="#6ea8d8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="352" y="332" font-size="10.5" fill="#6ea8d8" text-anchor="end">capture 쓰기</text>
  <line x1="680" y1="312" x2="680" y2="340" stroke="#e8825f" stroke-width="1.8" marker-end="url(#arro)"/>
  <text x="688" y="332" font-size="10.5" fill="#e8825f">install 쓰기</text>
  <line x1="560" y1="340" x2="560" y2="314" stroke="#7b746f" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="568" y="332" font-size="10.5" fill="#7b746f">doctor 읽기</text>
</svg>
