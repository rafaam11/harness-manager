<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200" role="img" aria-label="하네스 매니저">
  <defs>
    <linearGradient id="hm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1c1b"/>
      <stop offset="0.7" stop-color="#181716"/>
      <stop offset="1" stop-color="#2a1a12"/>
    </linearGradient>
    <linearGradient id="hm-logobg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a28"/>
      <stop offset="1" stop-color="#1a1a19"/>
    </linearGradient>
  </defs>
  <rect width="920" height="200" rx="18" fill="url(#hm-bg)"/>
  <rect x="0.5" y="0.5" width="919" height="199" rx="17.5" fill="none" stroke="#3b3633"/>

  <!-- logo (icon motif from scripts/generate-icon.mjs) -->
  <g transform="translate(56,58) scale(3.5)">
    <rect x="1.32" y="1.32" width="21.36" height="21.36" rx="5.4" fill="url(#hm-logobg)"/>
    <g fill="none" stroke="#e8825f" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="7.5,6.5 13.5,12 7.5,17.5"/>
      <line x1="13.5" y1="17.5" x2="18.5" y2="17.5"/>
    </g>
  </g>

  <!-- title + tagline -->
  <text x="186" y="92" font-family="Pretendard, Segoe UI, Malgun Gothic, sans-serif" font-size="40" font-weight="700" fill="#ece8e5">하네스 매니저</text>
  <text x="188" y="125" font-family="Pretendard, Segoe UI, Malgun Gothic, sans-serif" font-size="18" fill="#a59e98">새 PC도 같은 Claude Code · Codex 개발환경으로 — 로컬 전용 데스크톱 앱</text>

  <!-- chips -->
  <g font-family="Pretendard, Segoe UI, Malgun Gothic, sans-serif" font-size="13" font-weight="600">
    <rect x="188" y="146" width="76" height="25" rx="12.5" fill="#2c231e" stroke="#4f4945"/>
    <text x="226" y="163" fill="#e8825f" text-anchor="middle">상태판</text>
    <rect x="272" y="146" width="62" height="25" rx="12.5" fill="#2c231e" stroke="#4f4945"/>
    <text x="303" y="163" fill="#e8825f" text-anchor="middle">설치</text>
    <rect x="342" y="146" width="76" height="25" rx="12.5" fill="#2c231e" stroke="#4f4945"/>
    <text x="380" y="163" fill="#e8825f" text-anchor="middle">가져오기</text>
    <rect x="426" y="146" width="92" height="25" rx="12.5" fill="#2c231e" stroke="#4f4945"/>
    <text x="472" y="163" fill="#e8825f" text-anchor="middle">셋업 위저드</text>
    <rect x="526" y="146" width="82" height="25" rx="12.5" fill="#2c231e" stroke="#4f4945"/>
    <text x="567" y="163" fill="#e8825f" text-anchor="middle">로컬 전용</text>
  </g>
</svg>
