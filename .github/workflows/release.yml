name: release

# v* 태그를 푸시하면 windows·linux(x64/arm64) 산출물을 빌드해 GitHub 릴리스(draft)에 올린다.
# electron-builder가 draft 릴리스에 자산을 append하므로, 세 잡(win·linux-x64·linux-arm64)이
# 같은 태그 draft에 각자 산출물을 채운 뒤 사람이 GitHub에서 검토하고 수동 publish한다.
# linux-arm64는 GitHub 무료 arm64 러너(ubuntu-24.04-arm, public repo 한정)에서 네이티브 빌드 →
# Jetson/라즈베리파이4+ 등 aarch64 기기용 AppImage + latest-linux-arm64.yml 생성.
# (macOS는 서명/공증·빌드 환경 확보 후 별도 추가 — 그때 include에 macos-latest 한 줄 추가.)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require package version to match tag
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Unit and contract tests
        run: node node_modules/vitest/vitest.mjs run --maxWorkers=4
      - run: npm run build
      - name: Electron E2E (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test
      - name: Electron E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ runner.os }}
          path: test-results/
  build:
    needs: verify
    strategy:
      fail-fast: false
      # 잡 직렬화(동시성 1): electron-builder --publish는 잡마다 "릴리스 없으면 생성"을 하므로
      # 병렬이면 여러 잡이 같은 태그로 draft를 중복 생성한다(레이스 → arm64 자산이 별도 draft로 갈림).
      # 첫 잡이 draft를 만들고 나머지가 append하도록 순차 실행한다(릴리스 빌드라 시간 손해는 감수).
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            platform: "--linux"
          - os: ubuntu-24.04-arm
            platform: "--linux --arm64"
          - os: windows-latest
            platform: "--win"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + electron-vite)
        run: npm run build

      - name: Package & publish (draft)
        run: npx electron-builder ${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
